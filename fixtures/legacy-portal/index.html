<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LegacyCore Enterprise Portal v4.12.8</title>
  <style>
    body { font-family: "MS Sans Serif", Geneva, sans-serif; background-color: #d4d0c8; margin: 0; padding: 10px; font-size: 12px; }
    .window-frame { background: #ece9d8; border: 2px solid #7f9db9; padding: 5px; max-width: 900px; margin: 0 auto; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); }
    .title-bar { background: linear-gradient(90deg, #0a246a, #a6caf0); color: white; padding: 4px 8px; font-weight: bold; font-size: 13px; }
    .table-layout { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .table-layout td { padding: 4px; vertical-align: top; }
    .form-panel { background: #fff; border: 1px inset #d4d0c8; padding: 10px; }
    .btn-fake { display: inline-block; background: #ece9d8; border: 2px outset #ffffff; color: #000; padding: 3px 12px; cursor: pointer; text-decoration: none; user-select: none; font-size: 11px; margin-right: 5px; }
    .btn-fake:active { border-style: inset; }
    .btn-danger-fake { color: #900; }
    .alert-enterprise { padding: 8px 12px; margin-top: 10px; border: 1px solid #c00; font-weight: bold; }
    .alert-warning { background: #fff3cd; color: #856404; border-color: #ffeeba; }
    .alert-danger { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
    .alert-success { background: #d4edda; color: #155724; border-color: #c3e6cb; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { background: #ece9d8; border: 2px outset #fff; padding: 15px; width: 350px; box-shadow: 3px 3px 10px rgba(0,0,0,0.4); }
  </style>
</head>
<body>

  <!-- Transient Occluding Modal (Used for testing Recoverable Conditions) -->
  <div id="ctl00_pnlNoticeModal" class="modal-overlay">
    <div class="modal-box">
      <div style="font-weight: bold; margin-bottom: 8px;">System Announcement</div>
      <p style="margin-bottom: 12px;">Scheduled database maintenance window tonight at 23:00 UTC.</p>
      <div style="text-align: right;">
        <span id="ctl00_btnDismissModal" class="btn-fake modal-close" onclick="dismissModal()">Dismiss</span>
      </div>
    </div>
  </div>

  <div class="window-frame">
    <div class="title-bar">LegacyCore Portal - Member Administration System [PROD-US-EAST]</div>
    
    <!-- Deep Table Soup Layout (No semantic HTML) -->
    <table class="table-layout">
      <tr>
        <td style="width: 200px;">
          <div class="form-panel" style="height: 400px;">
            <b>Navigation Menu</b>
            <ul style="padding-left: 15px; margin-top: 5px; line-height: 1.6;">
              <li><a href="#" onclick="showSection('search')">Member Search</a></li>
              <li><a href="#" onclick="showSection('claims')">Claims Queue</a></li>
              <li><a href="#" onclick="triggerModal()">Show Maintenance Notice</a></li>
            </ul>
          </div>
        </td>
        <td>
          <div class="form-panel">
            <div style="border-bottom: 1px solid #999; padding-bottom: 4px; font-weight: bold; margin-bottom: 10px;">
              Query Member Database
            </div>

            <!-- Dynamic generated ASP.NET-style names/IDs -->
            <table cellpadding="4" cellspacing="0">
              <tr>
                <td style="text-align: right;">Member ID:</td>
                <td>
                  <!-- Notice: unsemantic loose text label without 'for' attribute -->
                  <input type="text" id="ctl00_MainContent_tabSearch_txtMemberId_8912" name="ctl00$MainContent$tabSearch$txtMemberId_8912" style="width: 140px;" />
                </td>
              </tr>
              <tr>
                <td style="text-align: right;">State / Region:</td>
                <td>
                  <select id="ctl00_MainContent_tabSearch_ddlRegion_4491">
                    <option value="ALL">All Regions</option>
                    <option value="CA">California</option>
                    <option value="NY">New York</option>
                    <option value="TX">Texas</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td></td>
                <td>
                  <!-- Unsemantic clickable span -->
                  <span id="ctl00_MainContent_btnSearch_329a" class="btn-fake" onclick="executeSearch()">Search</span>
                  <span id="ctl00_MainContent_btnReset_110b" class="btn-fake" onclick="resetForm()">Clear</span>
                </td>
              </tr>
            </table>

            <!-- Dynamic Search Result Region -->
            <div id="ctl00_pnlResults" style="margin-top: 15px; display: none;">
              <!-- Populated via executeSearch() -->
            </div>

          </div>
        </td>
      </tr>
    </table>
  </div>

  <script>
    function showSection(name) {
      console.log('Navigated to section:', name);
    }

    function triggerModal() {
      document.getElementById('ctl00_pnlNoticeModal').style.display = 'flex';
    }

    function dismissModal() {
      document.getElementById('ctl00_pnlNoticeModal').style.display = 'none';
    }

    function resetForm() {
      document.getElementById('ctl00_MainContent_tabSearch_txtMemberId_8912').value = '';
      document.getElementById('ctl00_pnlResults').style.display = 'none';
    }

    function executeSearch() {
      const input = document.getElementById('ctl00_MainContent_tabSearch_txtMemberId_8912').value.trim();
      const resultsDiv = document.getElementById('ctl00_pnlResults');
      resultsDiv.style.display = 'block';

      // Pathological Case A: Expected Business Outcome - Member Not Found
      if (input === '99999') {
        resultsDiv.innerHTML = `
          <div class="alert-enterprise alert-warning" id="ctl00_lblStatusMessage">
            Notice: No active member records found for search criteria.
          </div>
        `;
        return;
      }

      // Pathological Case B: Expected Business Outcome - Account Suspended
      if (input === '11111') {
        resultsDiv.innerHTML = `
          <div class="alert-enterprise alert-danger" id="ctl00_lblStatusMessage">
            Security Notice: Member account suspended - Read only mode.
          </div>
          <table border="1" cellpadding="3" style="width: 100%; border-collapse: collapse; margin-top: 5px;">
            <tr><td><b>Status</b></td><td>SUSPENDED</td></tr>
            <tr><td><b>Member Name</b></td><td>John Doe (Delinquent)</td></tr>
          </table>
        `;
        return;
      }

      // Happy Path: Member Found
      const memberId = input || '10042';
      resultsDiv.innerHTML = `
        <div class="alert-enterprise alert-success" id="ctl00_lblStatusMessage">
          Success: 1 Record Located in Active Partition
        </div>
        <table border="1" cellpadding="3" style="width: 100%; border-collapse: collapse; margin-top: 5px;" id="ctl00_gridMemberDetails">
          <tr style="background: #e0e0e0;">
            <th>Field</th>
            <th>Value</th>
          </tr>
          <tr>
            <td>Member ID</td>
            <td id="ctl00_out_memberId">${memberId}</td>
          </tr>
          <tr>
            <td>Full Legal Name</td>
            <td id="ctl00_out_fullName">Alice M. Henderson</td>
          </tr>
          <tr>
            <td>Plan Tier</td>
            <td id="ctl00_out_planTier">Platinum Premium Choice</td>
          </tr>
          <tr>
            <td>Account Balance</td>
            <td id="ctl00_out_balance">$240.50</td>
          </tr>
          <tr>
            <td>Tax Identifier (PII)</td>
            <td id="ctl00_out_ssn">987-65-4321</td>
          </tr>
        </table>
        <div style="margin-top: 10px;">
          <!-- High-Risk action button -->
          <span class="btn-fake btn-danger-fake" id="ctl00_btnDeleteMember" onclick="alert('Delete requested')">Purge Member Record</span>
        </div>
      `;
    }
  </script>
</body>
</html>
